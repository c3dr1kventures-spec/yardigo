name: YardiGo
options:
  bundleIdPrefix: nl.yardigo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YardiGo:
    type: application
    platform: macOS
    sources: [YardiGo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.yardigo.mac
        PRODUCT_NAME: YardiGo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: YardiGo
        INFOPLIST_KEY_NSLocationUsageDescription: "YardiGo gebruikt je locatie om verkopen bij jou in de buurt te tonen en op afstand te sorteren."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "YardiGo gebruikt je locatie om verkopen bij jou in de buurt te tonen en op afstand te sorteren."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSHumanReadableCopyright: "© YardiGo"
        CODE_SIGN_ENTITLEMENTS: YardiGo/YardiGo.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
