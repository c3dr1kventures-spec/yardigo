<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Weer op YardiGo zetten</title>
  <!-- Fase 2: herhaal-detectie. De link in de mail (herhaal-check) komt hier
       uit; met één klik staat de markt er met de nieuwe datum weer op. De
       token in de URL is het bewijs, zie herhaal-detectie.sql. -->
  <style>
    :root { --terra:#E07B39; --forest:#3A6B4A; --bark:#2C2416; --muted:#7A6E62; --bg:#F9F5EF; --bg2:#F2EADD; --border:#EDE8DF; --danger:#C44; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; color: var(--bark); background: var(--bg); line-height: 1.6; }
    h1 { font-size: 24px; color: var(--terra); margin: 0 0 4px; }
    .lede { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
    .card { background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 18px; margin: 18px 0; }
    .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
    .val { font-size: 15px; font-weight: 600; margin-bottom: 12px; word-wrap: break-word; }
    .rij { display: flex; gap: 10px; }
    .rij > div { flex: 1; min-width: 0; }
    input { width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 15px; background: white; color: var(--bark); }
    button { font-family: inherit; font-size: 15px; font-weight: 700; border-radius: 12px; padding: 14px; cursor: pointer; border: none; width: 100%; }
    .btn-primary { background: var(--forest); color: white; margin: 16px 0 10px; }
    .btn-secondary { background: white; color: var(--muted); border: 1.5px solid var(--border); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .ok { background: #EAF5EE; border-left: 3px solid var(--forest); color: #1F4A2D; padding: 12px 14px; border-radius: 8px; font-size: 14px; margin: 18px 0; font-weight: 600; }
    .err { background: #FBEEEE; border-left: 3px solid var(--danger); color: #7A2222; padding: 12px 14px; border-radius: 8px; font-size: 14px; margin: 18px 0; font-weight: 600; }
    .back { display: inline-block; font-size: 14px; font-weight: 600; color: var(--forest); text-decoration: none; margin-top: 12px; }
    .logo { font-size: 26px; font-weight: 800; color: var(--terra); margin-bottom: 24px; letter-spacing: -.5px; }
    footer { margin-top: 48px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 16px; }
    footer a { color: var(--terra); }
  </style>
</head>
<body>
  <div class="logo">📍 YardiGo</div>
  <h1 data-t="titel">Staat hij er dit jaar weer?</h1>
  <p class="lede" data-t="intro">Vorig jaar stond je markt op YardiGo. Klopt de nieuwe datum? Dan zetten we hem er met één klik weer op.</p>

  <div id="laden" class="card"><div class="val" data-t="laden">Even geduld…</div></div>
  <div id="fout" class="err" style="display:none"></div>

  <div id="formulier" style="display:none">
    <div class="card">
      <div class="label" data-t="markt">Markt</div>
      <div class="val" id="c-titel"></div>
      <div class="label" data-t="plek">Plaats</div>
      <div class="val" id="c-plek"></div>
      <div class="label" data-t="vorig">Vorig jaar</div>
      <div class="val" id="c-vorig"></div>
      <label class="label" for="i-datum" data-t="datum">Datum dit jaar</label>
      <input type="date" id="i-datum">
      <div class="rij" style="margin-top:12px">
        <div><label class="label" for="i-van" data-t="van">Van</label><input type="time" id="i-van"></div>
        <div><label class="label" for="i-tot" data-t="tot">Tot</label><input type="time" id="i-tot"></div>
      </div>
      <button class="btn-primary" id="b-ja" onclick="ja()" data-t="ja">Ja, zet hem erop</button>
      <button class="btn-secondary" id="b-nee" onclick="nee()" data-t="nee">Dit jaar niet</button>
    </div>
  </div>

  <div id="klaar" style="display:none">
    <div class="ok" id="klaar-tekst"></div>
    <a class="back" id="klaar-link" href="/" data-t="bekijk">Bekijk op YardiGo</a>
  </div>

  <footer><span data-t="footer">Je krijgt deze vraag omdat je deze markt vorig jaar op YardiGo zette.</span> <a href="/privacy" data-t="privacy">Privacy</a></footer>

  <script>
    var SUPABASE_URL = 'https://fwehqudhwzcnkcuypuqw.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3ZWhxdWRod3pjbmtjdXlwdXF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzOTQwNzgsImV4cCI6MjA4OTk3MDA3OH0.A5mPApoGySr97niz6QLZGFSDhsfCqOwi-k8v58mHjMI';

    var T = {
      nl: { titel: 'Staat hij er dit jaar weer?', intro: 'Vorig jaar stond je markt op YardiGo. Klopt de nieuwe datum? Dan zetten we hem er met één klik weer op.',
        laden: 'Even geduld…', markt: 'Markt', plek: 'Plaats', vorig: 'Vorig jaar', datum: 'Datum dit jaar', van: 'Van', tot: 'Tot',
        ja: 'Ja, zet hem erop', nee: 'Dit jaar niet', bekijk: 'Bekijk op YardiGo', privacy: 'Privacy',
        footer: 'Je krijgt deze vraag omdat je deze markt vorig jaar op YardiGo zette.',
        ok: 'Je markt staat weer op YardiGo. Bedankt!', al: 'Deze markt staat al weer op YardiGo.', nietOk: 'Helemaal goed, we vragen het dit jaar niet meer.',
        verlopen: 'Deze link is verlopen. Je kunt je markt gewoon opnieuw plaatsen op YardiGo.', onbekend: 'Deze link klopt niet (meer).',
        datumFout: 'Kies een datum vanaf vandaag.', mislukt: 'Dat lukte niet. Probeer het later nog eens.' },
      en: { titel: 'Is it on again this year?', intro: 'Your market was on YardiGo last year. Is the new date right? Then we will put it back on with one click.',
        laden: 'One moment…', markt: 'Market', plek: 'Place', vorig: 'Last year', datum: 'Date this year', van: 'From', tot: 'Until',
        ja: 'Yes, put it on', nee: 'Not this year', bekijk: 'View on YardiGo', privacy: 'Privacy',
        footer: 'You are receiving this because you listed this market on YardiGo last year.',
        ok: 'Your market is back on YardiGo. Thank you!', al: 'This market is already back on YardiGo.', nietOk: 'All right, we will not ask again this year.',
        verlopen: 'This link has expired. You can simply list your market again on YardiGo.', onbekend: 'This link is not valid (anymore).',
        datumFout: 'Choose a date from today onwards.', mislukt: 'That did not work. Please try again later.' },
      fr: { titel: 'Revient-il cette année ?', intro: "Votre marché était sur YardiGo l'an dernier. La nouvelle date est-elle correcte ? Nous le remettons en ligne en un clic.",
        laden: 'Un instant…', markt: 'Marché', plek: 'Lieu', vorig: "L'an dernier", datum: 'Date cette année', van: 'De', tot: 'À',
        ja: 'Oui, remettez-le en ligne', nee: 'Pas cette année', bekijk: 'Voir sur YardiGo', privacy: 'Confidentialité',
        footer: "Vous recevez ce message car vous avez publié ce marché sur YardiGo l'an dernier.",
        ok: 'Votre marché est de nouveau sur YardiGo. Merci !', al: 'Ce marché est déjà de nouveau sur YardiGo.', nietOk: "C'est noté, nous ne vous le demanderons plus cette année.",
        verlopen: 'Ce lien a expiré. Vous pouvez simplement republier votre marché sur YardiGo.', onbekend: "Ce lien n'est pas (ou plus) valide.",
        datumFout: "Choisissez une date à partir d'aujourd'hui.", mislukt: 'Cela n’a pas fonctionné. Réessayez plus tard.' },
      de: { titel: 'Findet er dieses Jahr wieder statt?', intro: 'Letztes Jahr war dein Markt auf YardiGo. Stimmt das neue Datum? Dann stellen wir ihn mit einem Klick wieder ein.',
        laden: 'Einen Moment…', markt: 'Markt', plek: 'Ort', vorig: 'Letztes Jahr', datum: 'Datum dieses Jahr', van: 'Von', tot: 'Bis',
        ja: 'Ja, wieder einstellen', nee: 'Dieses Jahr nicht', bekijk: 'Auf YardiGo ansehen', privacy: 'Datenschutz',
        footer: 'Du erhältst diese Nachricht, weil du diesen Markt letztes Jahr auf YardiGo eingestellt hast.',
        ok: 'Dein Markt ist wieder auf YardiGo. Danke!', al: 'Dieser Markt ist schon wieder auf YardiGo.', nietOk: 'Alles klar, wir fragen dieses Jahr nicht mehr.',
        verlopen: 'Dieser Link ist abgelaufen. Du kannst deinen Markt einfach neu auf YardiGo einstellen.', onbekend: 'Dieser Link ist nicht (mehr) gültig.',
        datumFout: 'Wähle ein Datum ab heute.', mislukt: 'Das hat nicht geklappt. Bitte versuche es später noch einmal.' }
    };
    var q = new URLSearchParams(location.search);
    var taal = (q.get('lang') || navigator.language || 'nl').slice(0, 2).toLowerCase();
    if (!T[taal]) taal = 'nl';
    var t = T[taal];
    document.documentElement.lang = taal;
    document.title = t.titel + ' | YardiGo';
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.dataset.t]; });
    var token = q.get('t') || '';

    function $(id) { return document.getElementById(id); }
    function toon(id) { ['laden', 'formulier', 'klaar'].forEach(function (x) { $(x).style.display = x === id ? '' : 'none'; }); }
    function fout(msg) { $('fout').textContent = msg; $('fout').style.display = ''; }
    function datumTekst(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString({ nl: 'nl-NL', en: 'en-GB', fr: 'fr-BE', de: 'de-DE' }[taal], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    async function rpc(fn, body) {
      var r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var j = await r.json().catch(function () { return null; });
      if (!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
      return j;
    }
    function klaar(tekst, listingId) {
      $('klaar-tekst').textContent = tekst;
      if (listingId) $('klaar-link').href = '/v/' + listingId;
      toon('klaar');
    }

    async function laad() {
      if (!/^[0-9a-f-]{36}$/i.test(token)) { toon(null); fout(t.onbekend); return; }
      try {
        var c = await rpc('herhaal_context', { p_token: token });
        if (!c) { toon(null); fout(t.onbekend); return; }
        if (c.status === 'bevestigd') return klaar(t.al, c.nieuw_listing_id);
        if (c.status === 'niet_dit_jaar') return klaar(t.nietOk, null);
        if (c.status === 'verlopen') { toon(null); fout(t.verlopen); return; }
        $('c-titel').textContent = c.titel;
        $('c-plek').textContent = [c.adres, c.plaats].filter(Boolean).join(', ');
        $('c-vorig').textContent = datumTekst(c.vorige_datum) + (c.tijd_van ? ', ' + c.tijd_van + (c.tijd_tot ? '–' + c.tijd_tot : '') : '');
        var vandaag = new Date().toISOString().slice(0, 10);
        $('i-datum').min = vandaag;
        $('i-datum').value = c.verwachte_datum >= vandaag ? c.verwachte_datum : '';
        $('i-van').value = c.tijd_van || '';
        $('i-tot').value = c.tijd_tot || '';
        toon('formulier');
      } catch (e) { toon(null); fout(t.mislukt); }
    }

    async function ja() {
      var datum = $('i-datum').value;
      if (!datum || datum < new Date().toISOString().slice(0, 10)) { fout(t.datumFout); return; }
      $('fout').style.display = 'none';
      $('b-ja').disabled = $('b-nee').disabled = true;
      try {
        var r = await rpc('herhaal_bevestig', { p_token: token, p_datum: datum, p_tijd_van: $('i-van').value || null, p_tijd_tot: $('i-tot').value || null });
        klaar(r.al_gedaan ? t.al : t.ok, r.listing_id);
      } catch (e) { fout(t.mislukt); $('b-ja').disabled = $('b-nee').disabled = false; }
    }

    async function nee() {
      $('b-ja').disabled = $('b-nee').disabled = true;
      try { await rpc('herhaal_niet_dit_jaar', { p_token: token }); klaar(t.nietOk, null); }
      catch (e) { fout(t.mislukt); $('b-ja').disabled = $('b-nee').disabled = false; }
    }

    laad();
  </script>
</body>
</html>
