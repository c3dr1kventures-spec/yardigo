<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Routeplanner: plan je rommelmarkt- en kringlooproute | YardiGo</title>
<meta name="description" content="Zet rommelmarkten, garagesales, rommelroutes en kringloopwinkels in één route. YardiGo zoekt de slimste volgorde met de openingstijden erbij. Delen via WhatsApp en starten in Google Maps, Apple Kaarten of Waze.">
<link rel="canonical" href="https://www.yardigo.nl/route">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.yardigo.nl/route">
<meta property="og:title" content="Routeplanner: plan je snuffeldag | YardiGo">
<meta property="og:description" content="Rommelmarkten, garagesales en kringloopwinkels in één slimme route.">
<meta property="og:image" content="https://www.yardigo.nl/og-image.png">
<meta property="og:site_name" content="YardiGo">
<meta name="theme-color" content="#3A6B4A">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/site/site.css">
<link rel="stylesheet" href="/site/routeplanner.css">
<script>
  // site/route.js tekent de planner in deze drie vakken (zie de uitleg bovenin route.js).
  window.YG_ROUTE_PAGINA = '#yg-rp-lijst';
  window.YG_ROUTE_BALK = '#yg-rp-balk';
  window.YG_ROUTE_DAG = '#yg-rp-dag';
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="/site/site.js" defer></script>
<script src="/site/kaart.js" defer></script>
<script src="/site/route.js" defer></script>
<script src="/site/routepagina.js" defer></script>
</head>
<body class="yg-mappage yg-rppage">
<a class="yg-skip" href="#yg-rp-lijst" data-i18n="rp.skip">Naar je route</a>

<header class="yg-header">
  <div class="yg-wrap yg-header__bar" style="max-width:none">
    <a class="yg-logo" href="/" data-i18n-aria="nav.home" aria-label="YardiGo, naar de startpagina">
      <img src="/site/logo.svg" alt="" width="22" height="28">
      <span>Yard<span class="yg-i">i</span><span class="yg-go">Go</span></span>
    </a>
    <nav class="yg-nav" aria-label="Hoofdmenu">
      <a href="/kaart" data-i18n="nav.map">Kaart</a>
      <a href="/route" aria-current="page" data-i18n="nav.planner">Routeplanner</a>
      <a href="/rommelmarkt/dit-weekend" data-i18n="nav.agenda">Agenda</a>
      <a href="/kringloop/" data-i18n="nav.thrift">Kringloopwinkels</a>
    </nav>
    <div class="yg-header__end">
      <a class="yg-btn yg-btn--primary" href="/aanmelden" data-i18n="nav.post">Verkoop aanmelden</a>
      <button class="yg-menu-btn" type="button" aria-expanded="false" aria-controls="yg-menu" data-i18n-aria="nav.menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <div class="yg-wrap yg-menu" id="yg-menu">
    <a href="/kaart" data-i18n="nav.map">Kaart</a>
    <a href="/route" aria-current="page" data-i18n="nav.planner">Routeplanner</a>
    <a href="/rommelmarkt/dit-weekend" data-i18n="nav.agenda">Agenda</a>
    <a href="/kringloop/" data-i18n="nav.thrift">Kringloopwinkels</a>
    <a href="/organisatoren" data-i18n="nav.organisers">Voor organisatoren</a>
  </div>
</header>

<div class="yg-rp-dag" id="yg-rp-dag" role="group" aria-label="Je dag" data-i18n-aria="rt.day" hidden></div>

<main class="yg-rp">
  <section class="yg-rp__lijst" id="yg-rp-lijst" aria-labelledby="yg-route-kop">
    <h1 id="yg-route-kop">Routeplanner</h1>
    <p class="yg-meta">Zet rommelmarkten, garagesales en kringloopwinkels in je route. YardiGo zoekt de slimste volgorde met de openingstijden erbij.</p>
  </section>
  <section class="yg-rp__kaart" aria-label="Kaart" data-i18n-aria="map.map">
    <div class="yg-kaart" id="yg-rp-kaart"></div>
    <div class="yg-mapctl">
      <button type="button" id="rp-in" data-i18n-aria="map.zoomIn" aria-label="Inzoomen">+</button>
      <button type="button" id="rp-uit" data-i18n-aria="map.zoomOut" aria-label="Uitzoomen">−</button>
      <button type="button" id="rp-alles" data-i18n-aria="rp.fit" aria-label="Hele route tonen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2922" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button type="button" id="rp-hier" data-i18n-aria="map.locate" aria-label="Mijn locatie"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2922" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="#1E2922"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
  </section>
  <aside class="yg-rp__detail" id="yg-rp-detail" aria-label="Stop"></aside>
</main>

<div class="yg-rp-balk" id="yg-rp-balk" hidden></div>
</body>
</html>
