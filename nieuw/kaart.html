<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kaart: rommelmarkten en opritverkopen | YardiGo</title>
<meta name="theme-color" content="#3A6B4A">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="/site/site.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
<script src="/site/site.js" defer></script>
<script src="/site/kaart.js" defer></script>
<script src="/nieuw/kaart.js" defer></script>
</head>
<body class="yg-mappage">

<header class="yg-header">
  <div class="yg-wrap yg-header__bar" style="max-width:none">
    <a class="yg-logo" href="/nieuw" data-i18n-aria="nav.home" aria-label="YardiGo, naar de startpagina">
      <img src="/site/logo.svg" alt="" width="22" height="28">
      <span>Yard<span class="yg-i">i</span><span class="yg-go">Go</span></span>
    </a>
    <form id="zoek" class="yg-input" style="border-radius:999px;max-width:380px;flex:1;min-width:0" role="search" novalidate>
      <label for="plaats" class="yg-sr" data-i18n="home.wherePh">Plaats of postcode</label>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A6B4A" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="plaats" autocomplete="address-level2" data-i18n-placeholder="home.wherePh" placeholder="Plaats of postcode" style="padding:9px 10px">
      <button type="submit" class="yg-sr" data-i18n="map.search">Zoek</button>
    </form>
    <div class="yg-header__end">
      <nav class="yg-nav" aria-label="Hoofdmenu">
        <a href="/rommelmarkt/dit-weekend" data-i18n="nav.agenda">Agenda</a>
        <a href="/organisatoren" data-i18n="nav.organisers">Voor organisatoren</a>
      </nav>
      <a class="yg-btn yg-btn--primary" href="/aanmelden" data-i18n="nav.post">Verkoop aanmelden</a>
      <button class="yg-menu-btn" type="button" aria-expanded="false" aria-controls="yg-menu" data-i18n-aria="nav.menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <div class="yg-wrap yg-menu" id="yg-menu">
    <a href="/nieuw" data-i18n="map.backHome">Terug naar de startpagina</a>
    <a href="/rommelmarkt/dit-weekend" data-i18n="nav.agenda">Agenda</a>
    <a href="/organisatoren" data-i18n="nav.organisers">Voor organisatoren</a>
  </div>
</header>

<div class="yg-wrap yg-toolbar" style="max-width:none" role="toolbar" aria-label="Filters" data-i18n-aria="map.filters">
  <div id="dagen" style="display:contents"></div>
  <span class="yg-toolbar__sep" aria-hidden="true"></span>
  <button class="yg-chip" type="button" data-soort="markt" aria-pressed="true"><span class="yg-mark yg-mark--markt"></span><span data-i18n="type.markets">Markten</span></button>
  <button class="yg-chip" type="button" data-soort="route" aria-pressed="true"><span class="yg-mark yg-mark--route"></span><span data-i18n="nav.routes">Rommelroutes</span></button>
  <button class="yg-chip" type="button" data-soort="oprit" aria-pressed="true"><span class="yg-mark yg-mark--oprit"></span><span data-i18n="nav.driveway">Opritverkoop</span></button>
</div>

<div class="yg-split">
  <section class="yg-split__list" aria-labelledby="res">
    <div class="yg-section__head" style="margin-bottom:4px">
      <h1 id="res">&nbsp;</h1>
      <span class="yg-meta" id="sort"></span>
    </div>
    <p class="yg-error" id="fout" role="alert" hidden></p>
    <ol class="yg-rows" id="lijst"></ol>
    <p class="yg-meta" id="leeg" hidden data-i18n="map.noneInView">Hier is in deze periode niets.</p>
    <p class="yg-meta" id="meer" hidden></p>
  </section>
  <section class="yg-split__map" aria-label="Kaart" data-i18n-aria="map.map">
    <div class="yg-kaart" id="kaart"></div>
    <div class="yg-mapctl">
      <button type="button" id="in" data-i18n-aria="map.zoomIn" aria-label="Inzoomen">+</button>
      <button type="button" id="uit" data-i18n-aria="map.zoomOut" aria-label="Uitzoomen">−</button>
      <button type="button" id="hier" data-i18n-aria="map.locate" aria-label="Mijn locatie"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2922" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="#1E2922"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="yg-legend">
      <span><span class="yg-mark yg-mark--markt"></span><span data-i18n="type.market">Markt</span></span>
      <span><span class="yg-mark yg-mark--route"></span><span data-i18n="type.route">Rommelroute</span></span>
      <span><span class="yg-mark yg-mark--oprit"></span><span data-i18n="type.driveway">Opritverkoop</span></span>
      <span><span style="width:10px;height:10px;border-radius:50%;background:#3A6B4A;border:2px solid #fff;box-shadow:0 0 0 1px #C5CFC2"></span><span data-i18n="map.legend">Kleiner of verder weg</span></span>
    </div>
  </section>
</div>
</body>
</html>
